<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="果冻狂奔：全自动、随机、末位淘汰的横版大逃亡观赏游戏">
<meta name="theme-color" content="#141228">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AE%3C/text%3E%3C/svg%3E">
<title>果冻狂奔 · Jelly Rush</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#141228;color:#f3f0ff;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer;border:0;border-radius:8px;background:#2f2a55;color:#f3f0ff;padding:6px 12px;font-size:14px}
button:hover{background:#443c7a}
button.pri{background:#ff7a59;color:#2a1208;font-weight:700}
button.pri:hover{background:#ff9478}
input,select{font-family:inherit;background:#1d1a3a;color:#f3f0ff;border:1px solid #3c3670;border-radius:6px;padding:4px 6px;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(14,12,34,.94);overflow:auto;padding:22px 26px;z-index:10}
.hidden{display:none!important}
h1{margin:0;font-size:30px;letter-spacing:2px}
#ver{font-size:12px;font-weight:400;letter-spacing:0;color:#a9a3d8;background:#2f2a55;border-radius:10px;padding:2px 8px;margin-left:10px;vertical-align:middle}
h1 small{font-size:14px;font-weight:400;color:#a9a3d8;margin-left:10px;letter-spacing:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.bar .sp{flex:1}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
.card{background:#1f1b40;border:1px solid #37316a;border-radius:12px;padding:10px;display:flex;gap:10px}
.card canvas{width:84px;height:84px;background:#2a2556;border-radius:10px;flex:none}
.cf{flex:1;min-width:0}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row .nm{flex:1;min-width:0;font-weight:700}
.row input[type=color]{width:34px;height:28px;padding:1px}
.row select{flex:1;min-width:0}
.row button{padding:4px 8px}
.attrs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 10px}
.attrs div{display:flex;align-items:center;gap:5px;font-size:12px;color:#c9c4ee}
.attrs input{flex:1;min-width:0;padding:0;accent-color:#ff7a59}
.attrs b{width:16px;text-align:right;color:#fff}
.meta{font-size:12px;color:#a9a3d8;margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.rules{font-size:13px;color:#b9b3e6;line-height:1.7;margin-top:14px;max-width:980px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{position:absolute}
#tinfo{left:14px;top:10px;font-size:14px;line-height:1.5;background:rgba(15,12,40,.6);padding:6px 10px;border-radius:8px}
#tbox{left:0;right:0;margin:0 auto;top:10px;width:min(420px,40vw);background:rgba(15,12,40,.6);border-radius:10px;padding:6px 10px;text-align:center;font-size:14px}
#tbar{height:8px;background:#2c2752;border-radius:4px;margin-top:5px;overflow:hidden}
#tfill{height:100%;width:0;background:#ffd34d}
#ctrl{right:14px;top:10px;pointer-events:auto;display:flex;gap:6px}
#rank{right:14px;top:54px;width:176px;background:rgba(15,12,40,.6);border-radius:10px;padding:6px 8px;font-size:13px}
#rank div{display:flex;align-items:center;gap:6px;height:20px;white-space:nowrap;overflow:hidden}
#rank i{width:10px;height:10px;border-radius:50%;flex:none}
#rank .dead{opacity:.4;text-decoration:line-through}
#rank .n{width:18px;color:#a9a3d8;text-align:right}
#feed{left:14px;top:96px;font-size:13px;line-height:1.6}
#feed div{background:rgba(15,12,40,.6);padding:2px 8px;border-radius:6px;margin-bottom:3px}
#cmt{left:0;right:0;margin:0 auto;width:fit-content;bottom:20px;background:rgba(15,12,40,.72);padding:8px 18px;border-radius:20px;font-size:17px;white-space:nowrap;transition:opacity .25s}
table{border-collapse:collapse;width:100%;max-width:900px;font-size:14px;margin-top:10px}
td,th{padding:5px 8px;text-align:left;border-bottom:1px solid #2f2a55}
th{color:#a9a3d8;font-weight:400}
.aw{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.aw div{background:#1f1b40;border:1px solid #37316a;border-radius:10px;padding:8px 12px;font-size:14px}
.aw b{color:#ffd34d}
body.watch{cursor:none}
body.watch #ctrl,body.watch #result .bar{display:none}
#nextIn{color:#ffd34d;font-size:15px;margin:10px 0}
#recBox{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px 0;padding:10px 14px;border:1px solid #ff6b6b;border-radius:10px;background:rgba(255,107,107,.1);font-size:14px;cursor:default}
#recBox.hidden{display:none}
#recBox small{color:#a9a3d8;flex-basis:100%}
#recBox button{cursor:pointer}
canvas#cv,#hud{touch-action:manipulation;user-select:none;-webkit-user-select:none}
button,select,label{touch-action:manipulation}
/* 小屏（手机）布局 */
@media (max-width:720px){
  .overlay{padding:14px 12px}
  h1{font-size:22px}h1 small{display:block;margin:4px 0 0}
  #cards{grid-template-columns:minmax(0,1fr)}
  .card{padding:8px;gap:8px}.row select{padding:4px 2px}
  .card canvas{width:64px;height:64px}
  #ctrl{right:8px;top:8px}#ctrl button{padding:5px 9px;font-size:13px}
  #tbox{left:8px;right:8px;top:44px;width:auto;font-size:13px;padding:5px 8px}
  #tinfo{left:8px;top:88px;font-size:11px;padding:4px 7px}
  #rank{right:8px;top:88px;width:112px;font-size:11px;padding:4px 6px}#rank div{height:16px;gap:4px}#rank .n{width:14px}
  #feed{display:none}
  #rank{top:106px}
  #cmt{font-size:13px;white-space:normal;text-align:center;width:max-content;max-width:92vw;bottom:12px;padding:6px 12px}
  #rtable{font-size:12px}td,th{padding:4px 5px;white-space:nowrap}
  #champ canvas{width:84px;height:84px}
}
@media (max-width:720px) and (orientation:portrait){body.watch #rank{display:none}}
#home{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-start;justify-content:center;text-align:center;padding:9vh 16px 16px;background:radial-gradient(ellipse at center,rgba(14,12,34,.28),rgba(14,12,34,.62))}
.htitle{font-size:clamp(46px,10vw,104px);font-weight:900;letter-spacing:6px;color:#ffe066;text-shadow:0 5px 0 #c2410c,0 10px 20px rgba(0,0,0,.6);animation:hbob 1.6s ease-in-out infinite}
@keyframes hbob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
.hsub{font-size:clamp(14px,2.2vw,20px);margin:10px 0 26px;text-shadow:0 2px 6px #000}
.hbtns{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.hbtns button{font-size:clamp(18px,2.6vw,24px);padding:14px 34px;border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.hbtns button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
#bHomeSetup{background:rgba(47,42,85,.94)}
#homeInfo{display:inline-block;margin-top:22px;font-size:13px;color:#e4e0fa;background:rgba(15,12,40,.55);padding:4px 12px;border-radius:12px}
#homeVer{position:absolute;right:14px;bottom:10px;font-size:12px;color:#c9c4ee;text-shadow:0 1px 3px #000}
#champ{display:flex;align-items:center;gap:16px}
#champ canvas{width:120px;height:120px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="tinfo"></div>
  <div id="tbox"><span id="tlabel"></span><div id="tbar"><div id="tfill"></div></div></div>
  <div id="ctrl">
    <button id="bSpeed">1×</button><button id="bPause">暂停</button><button id="bMute">🔊</button><button id="bQuit">退出</button>
  </div>
  <div id="rank"></div>
  <div id="feed"></div>
  <div id="cmt"></div>
</div>

<div id="home" class="hidden">
  <div class="hbox">
    <div class="htitle">果冻狂奔</div>
    <div class="hsub">全自动 · 随机 · 末位淘汰的横版大逃亡</div>
    <div class="hbtns"><button id="bHomeStart" class="pri">开始狂奔 ▶</button><button id="bHomeSetup">⚙ 自定义配置</button></div>
    <div id="homeInfo"></div>
  </div>
  <div id="homeVer"></div>
</div>

<div id="setup" class="overlay hidden">
  <h1>果冻狂奔<span id="ver"></span><small>全自动 · 随机 · 末位淘汰的横版大逃亡</small></h1>
  <div class="bar">
    <button id="bHome">← 首页</button>
    <button id="bAdd">＋ 添加选手</button>
    <button id="bRand">🎲 全部随机</button>
    <label>资源包 <select id="selPack"></select></label>
    <label>地图 <select id="selMap"></select></label>
    <label>人数 <select id="selN"></select></label>
    <label>种子 <input id="seed" placeholder="留空=随机" size="10"></label>
    <label title="隐藏所有按钮，结算后自动开始下一局；按 Esc 或双击屏幕返回首页"><input type="checkbox" id="chkWatch"> 纯观赏模式</label>
    <label id="lblRec" class="hidden" title="仅本地运行时可用：录下整局比赛（含声音），结算时可选择导出保存，不导出则自动删除"><input type="checkbox" id="chkRec"> 🎬 录制本局</label>
    <span class="sp"></span>
    <button id="bStart" class="pri" style="font-size:17px;padding:9px 26px">开始比赛 ▶</button>
  </div>
  <div id="cards"></div>
  <div class="rules">
    <b>规则：</b>所有选手自动向前冲，全程无需操作。左侧的<b>吞噬者</b>持续逼近，被追上即出局；同时每隔一段时间<b>天雷裁决</b>会劈掉当时的最后一名。
    掉进坑里不会直接出局，但会损失时间。只剩两人时出现终点线，先冲线者夺冠。每名选手有 30 点属性和一个被动特性——不过这是一场<b>运气主导</b>的比赛，属性只是让天平稍微倾斜。
  </div>
</div>

<div id="result" class="overlay hidden">
  <div id="champ"><canvas id="champCv" width="240" height="240"></canvas><div><h1 id="champName"></h1><div id="champSub" style="color:#a9a3d8;margin-top:6px"></div></div></div>
  <div class="aw" id="awards"></div>
  <div id="nextIn"></div>
  <div id="recBox" class="hidden"></div>
  <div class="bar">
    <button id="bAgain" class="pri">再来一局（新种子）</button>
    <button id="bReplay">重播本局</button>
    <button id="bBack">返回首页</button>
  </div>
  <table id="rtable"></table>
</div>

<script src="icons/ai/icons.js"></script>
<script>
'use strict';
// ================= 工具 =================
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const ch of String(s)){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function pick(rng,tb){let s=0;for(const e of tb)s+=Math.max(0,e[1]);let v=rng()*s;for(const e of tb){v-=Math.max(0,e[1]);if(v<=0)return e[0]}return tb[0][0]}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const r=clamp((n>>16)+amt,0,255),g=clamp((n>>8&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return `rgb(${r},${g},${b})`}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const $=id=>document.getElementById(id);

// ================= 常量与数据 =================
const VERSION='1.6.1'; // 每次发布时手动递增
const V0=300, GRAV=1800, RAD=17, DT=1/60;
const GRACE=12, TB=165, HARD=205, ABS=240, POINTS=30;
const ATTRS=[['spd','速度'],['acc','爆发'],['jmp','跳跃'],['sta','耐力'],['bal','稳定'],['luk','幸运']];
const TRAITS={late:['慢热','开局慢，越跑越快'],front:['领跑者','领先时额外加速'],come:['逆袭','排名靠后时爆发'],slick:['滑头','冰面、香蕉皮不打滑，无视逆向传送带'],
  iron:['铁头','撞碎路障不减速'],hop:['弹簧腿','跳跃更稳'],lucky:['福星','道具更好，不出炸弹'],fear:['求生欲','吞噬者逼近时狂奔'],loach:['泥鳅','泥沼几乎不减速'],
  start:['抢跑','开局前 10 秒爆发，起步和重新加速更快'],wind:['御风','风区和逆风不减速，顺风更快'],tumbler:['不倒翁','被控时间减半'],climb:['攀登者','上坡不减速，下坡更快'],
  draft:['尾随','紧跟前一名时借力加速'],dodge:['灵巧','更容易闪避摆锤、落石和陨石'],clutch:['大心脏','只剩最后几人时加速']};
const dodgeBonus=r=>r.trait==='dodge'?0.45:0;
const HATS={none:'无头饰',crown:'皇冠',cap:'鸭舌帽',horn:'小角',antenna:'天线',bow:'蝴蝶结',leaf:'嫩芽',halo:'光环',tophat:'礼帽'};
const SHAPES={round:'圆滚滚',square:'方墩墩',tall:'高个子'};
const NAMES=['布丁','团子','年糕','汤圆','麻薯','豆包','奶盖','芋圆','果冻','可乐','薯条','饭团','糯米','馒头','泡芙','仙草','椰果','咸蛋','酸奶','包子','汉堡','奶茶','栗子','橘子'];
const COLORS=['#ff6b6b','#ffa94d','#ffd43b','#a9e34b','#51cf66','#38d9a9','#3bc9db','#4dabf7','#748ffc','#9775fa','#da77f2','#f783ac','#e8590c','#20c997','#fcc2d7','#c0eb75'];
function hsl(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))))).toString(16).padStart(2,'0');return '#'+f(0)+f(8)+f(4)}
// ---- 资源包：list 为角色条目，mk 生成 {name,color,d,trait}，label 为下拉显示名 ----
const sp=s=>s.split(' ').map(x=>x.split(':'));
const PACKS={
  jelly:{n:'🍮 果冻原味'},
  sanguo:{n:'⚔️ 三国名将',list:sp('曹操:魏:front 夏侯惇:魏:iron 张辽:魏:fear 许褚:魏:tumbler 典韦:魏:iron 司马懿:魏:late 徐晃:魏:climb 张郃:魏:draft 夏侯渊:魏:front 郭嘉:魏:lucky 刘备:蜀:fear 关羽:蜀:clutch 张飞:蜀:iron 赵云:蜀:dodge 马超:蜀:start 黄忠:蜀:late 诸葛亮:蜀:wind 魏延:蜀:come 姜维:蜀:come 庞统:蜀:lucky 孙权:吴 周瑜:吴:lucky 吕蒙:吴:late 陆逊:吴:late 甘宁:吴:loach 太史慈:吴:hop 孙策:吴:front 黄盖:吴:iron 吕布:群:front 貂蝉:群:slick 董卓:群:iron 袁绍:群 华佗:群:lucky 张角:群:lucky'),
    mk:(p,i)=>({name:p[0],trait:p[2],color:hsl({魏:215,蜀:130,吴:345,群:275}[p[1]]+(i*37)%36-18,68,56+(i%3)*6),d:{f:p[1]}}),label:p=>`【${p[1]}】${p[0]}`},
  shuihu:{n:'🌟 水浒三十六天罡',list:sp('宋江:呼保义:lucky 卢俊义:玉麒麟:front 吴用:智多星:lucky 公孙胜:入云龙:wind 关胜:大刀:front 林冲:豹子头:come 秦明:霹雳火:front 呼延灼:双鞭:iron 花荣:小李广:dodge 柴进:小旋风:lucky 李应:扑天雕:hop 朱仝:美髯公:draft 鲁智深:花和尚:tumbler 武松:行者:clutch 董平:双枪将:front 张清:没羽箭 杨志:青面兽:late 徐宁:金枪手:climb 索超:急先锋:front 戴宗:神行太保:start 刘唐:赤发鬼:fear 李逵:黑旋风:iron 史进:九纹龙:hop 穆弘:没遮拦:iron 雷横:插翅虎:hop 李俊:混江龙:loach 阮小二:立地太岁:loach 张横:船火儿:loach 阮小五:短命二郎:fear 张顺:浪里白条:slick 阮小七:活阎罗:loach 杨雄:病关索:late 石秀:拼命三郎:fear 解珍:两头蛇:slick 解宝:双尾蝎:come 燕青:浪子:dodge'),
    mk:(p,i)=>({name:p[0],trait:p[2],color:hsl(i*47,62,60),d:{nick:p[1],no:i+1}}),label:(p,i)=>`${i+1}. ${p[1]} ${p[0]}`},
  seal:{n:'🈴 百家姓',list:[...'赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜'].map(ch=>[ch]),
    mk:(p,i)=>({name:p[0],color:hsl(i*53,64,48),d:{ch:p[0]}}),label:p=>p[0]},
  food:{n:'🍔 美食',list:sp('🍔:汉堡:#e8a04c 🍙:饭团:#dee2e6 🍩:甜甜圈:#f783ac 🍉:西瓜:#fa5252 🍮:布丁:#f0c05a 🍕:披萨:#ffb84d 🍦:冰淇淋:#fff3bf 🥟:饺子:#f8e8c8 🍣:寿司:#ff8a65 🧋:奶茶:#c89f7a 🍳:煎蛋:#ffe066 🍡:团子:#b2f2bb 🥮:月饼:#d9843b 🌮:塔可:#f2c94c 🍟:薯条:#ffd43b 🍜:拉面:#f59f00 🧁:纸杯蛋糕:#faa2c1 🍰:蛋糕:#ffdeeb 🥐:可颂:#e0a458 🍗:鸡腿:#c77d3a 🌭:热狗:#e8590c 🍓:草莓:#f03e3e 🍑:桃子:#ffa8a8 🥑:牛油果:#74b816 🍪:曲奇:#b9773a 🥞:松饼:#f4c27a'),

const ICONS={};
function aiIcon(slug){
  if(!slug)return null;let e=ICONS[slug];
  if(!e){const dot=slug.includes('.');e=ICONS[slug]={img:new Image(),ok:false,ext:dot?['']:['.svg','.png']}; // 文件名自带扩展名时直接用
    // 本地双击打开（file://）时，直接加载的图片文件会污染画布，导致录制只有声音没有画面；
    // 这时只用 icons/ai/icons.js 里内嵌的 data URI（由 icons/ai/pack.py 生成），没有就回退到自绘徽记
    if(location.protocol==='file:'){const u=(window.AI_ICONS||{})[slug.replace(/\.\w+$/,'')];e.ext=u?[u]:[]}
    const next=()=>{const x=e.ext.shift();if(x!=null)e.img.src=x.startsWith('data:')?x:`icons/ai/${slug}${x}`};
    e.img.onload=()=>{e.ok=e.img.naturalWidth>0;if(e.ok&&typeof refreshPreviews==='function')refreshPreviews()};e.img.onerror=next;next()}
  return e.ok?e.img:null;
}

let AC=null, muted=false, musicOff=false, musicBus=null, outBus=null, noiseBuf=null;

  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();musicBus=AC.createGain();musicBus.gain.value=0.6;outBus=AC.createGain();outBus.connect(AC.destination);musicBus.connect(comp);comp.connect(outBus);

  return AC;
}
function tone(f,d,type,vol,to,delay){
  if(muted)return;
  try{audio();const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(outBus);o.start(t);o.stop(t+d+0.02)}catch(e){}

  else if(h==='tophat'){c.fillStyle='#2b2b3a';c.fillRect(-8,top-13,16,15);c.strokeRect(-8,top-13,16,15);c.beginPath();c.moveTo(-13,top+2);c.lineTo(13,top+2);c.lineWidth=3.5;c.stroke()}

function groundY(g,x){
  const p=g.hpts;let lo=0,hi=p.length-1;
  if(x<=p[0].x)return p[0].h;if(x>=p[hi].x)return p[hi].h;
  while(hi-lo>1){const m=(lo+hi)>>1;if(p[m].x<=x)lo=m;else hi=m}
  const a=p[lo],b=p[hi];let t=(x-a.x)/(b.x-a.x);t=t*t*(3-2*t);return a.h+(b.h-a.h)*t;
}
function genTrack(g){
  const R=g.trng;
  while(g.genX<g.leadX+4200){
    const d=clamp(g.genX/28000,0,1);
    g.genX+=240+R()*300-d*80;
    const x0=g.genX,h=g.h;
    if(g.genStop!=null&&x0+700>g.genStop){g.genX=Infinity;break}
    const tp=pick(R,[['gap',16+5*d],['hurdle',18],['spring',7],['pend',d>0.08?9:0],['mud',9],['ice',9],['belt',8],['wind',6],['rocks',d>0.05?7:0],['box',19],['slope',18]].map(e=>[e[0],e[1]*(g.map.w[e[0]]??1)]));
    const add=(o)=>{o.h=h;g.feats.push(o);return o};
    if(tp==='gap'){const w=90+R()*110+d*40;add({type:'gap',x0,x1:x0+w});g.genX=x0+w+120}
    else if(tp==='hurdle'){let n=1+(R()<0.3+0.3*d?1:0)+(R()<0.25*d?1:0),x=x0;for(let i=0;i<n;i++){add({type:'hurdle',x0:x,x1:x+26,hh:26+R()*16});x+=200}g.genX=x-120}
    else if(tp==='spring'){add({type:'spring',x0,x1:x0+40,anim:0});g.genX=x0+940}
    else if(tp==='pend'){add({type:'pend',x0,x1:x0+240,xc:x0+120,L:150,ph:R()*6.28,w:2.5+R()*0.9});g.genX=x0+300}
    else if(tp==='mud'||tp==='ice'||tp==='belt'||tp==='wind'||tp==='rocks'){
      const len={mud:260+R()*260,ice:300+R()*300,belt:300+R()*250,wind:400+R()*300,rocks:420+R()*200}[tp];
      add({type:tp,x0,x1:x0+len,dir:R()<0.45?1:-1,spT:0});g.genX=x0+len+60}
    else if(tp==='box'){add({type:'box',x0,x1:x0+30,got:{}})}
    else{const len=280+R()*320;let dh=(R()<0.5?-1:1)*Math.min(60+R()*120,len*0.4);if(Math.abs(h+dh)>320)dh=-dh;
      g.hpts.push({x:x0,h},{x:x0+len,h:h+dh});g.h=h+dh;g.genX=x0+len+60}
  }
}
function fixFi(g,r){const F=g.feats;while(r.fi<F.length&&F[r.fi].x1<r.x-80)r.fi++;while(r.fi>0&&F[r.fi-1].x1>=r.x-80)r.fi--}
function gapAt(g,r,x){const F=g.feats;for(let i=r.fi;i<F.length;i++){const f=F[i];if(f.x0>x)break;if(f.type==='gap'&&x>f.x0&&x<f.x1)return f}return null}
function gapNear(g,r){const F=g.feats;for(let i=r.fi;i<F.length;i++){const f=F[i];if(f.x0>r.x+200)break;if(f.type==='gap'&&r.x>f.x0-170&&r.x<f.x1+20)return true}return false}
function pendBob(g,f){const th=1.25*Math.sin(g.t*f.w+f.ph);return [f.xc+Math.sin(th)*f.L,f.h-f.L-30+Math.cos(th)*f.L]}

function newGame(cfgs,seed,headless,mapKey){

    hpts:[{x:-6000,h:0},{x:0,h:0}],feats:[],genX:900,h:0,genStop:null,leadX:0,
    rs:[],rank:[],aliveN:0,order:[],wallX:-1100,wallV:0,pace:V0,timer:0,I:0,mercyUntil:0,duel:null,sudden:false,over:false,winner:null,overT:0,shown:false,
    ev:null,evT:0,lastEv:'',rocks:[],meteors:[],traps:[],strikes:[],

    cam:{x:-500,y:0,z:1},cfgs};
  const N=cfgs.length;

  cfgs.forEach((c,i)=>{
    g.rs.push({id:i,name:c.name,color:c.color,shape:c.shape,hat:c.hat,trait:c.trait,a:Object.assign({},c.a),style:c.style||'jelly',d:c.d||{},
      x:-22,y:0,vx:0,vy:0,avx:0,g:GRAV,onGround:true,state:'run',alive:true,rank:i+1,fi:0,lane:(i%5-2)*4,
      stun:0,slide:false,spin:0,form:0,formTg:0,formT:0,boost:0,perfT:0,shield:0,rocket:0,pendCd:0,iceT:0,zoneRef:null,
      tried:null,pass:null,lastSpring:null,fell:false,resT:0,resX:0,stX:0,stT:0,ccT:0,leg:i,sq:0,

  g.rank=g.rs.slice().sort((p,q)=>q.x-p.x);g.rank.forEach((r,i)=>r.rank=i+1);g.aliveN=N;

function say(g,text){if(g.headless)return;g.msgs.push(text);if(g.msgs.length>4)g.msgs.splice(0,g.msgs.length-4)}
function popup(g,r,text,col){if(g.headless)return;g.pops.push({r,text,t:1.3,col:col||'#fff'})}
function burst(g,x,y,col,n,spd,grav){

}
function bolt(g,x,y){if(g.headless)return;const pts=[];for(let i=0;i<=8;i++)pts.push((Math.random()-0.5)*50*(i<8?1:0));g.fx.push({x,y,life:0.4,pts})}

function hurt(g,r,dur,slide){

  if(r.shield>0){r.shield=0;popup(g,r,'🛡 格挡!','#8ce99a');return false}
  r.stun=Math.max(r.stun,dur*(1-0.05*(r.a.bal-5))*(r.trait==='tumbler'?0.5:1));r.slide=!!slide;r.st.stuns++;return true;
}
function knock(g,r,avx,vy,stun){

}
function flightTo(g,r,avx,D){r.g=g.grav;const t=D/avx;r.onGround=false;r.avx=avx;r.vy=-r.g*t/2}
function jumpMod(g){return g.ev?(g.ev.type==='night'?-0.13:g.ev.type==='fever'?-0.08:0):0}

function giveItem(g,r,force){
  const n=g.aliveN,f=n>1?(r.rank-1)/(n-1):0,l=r.a.luk-5,lucky=r.trait==='lucky';
  let it=force||pick(g.rng,[['boost',2.4],['rocket',(0.8+3*f)*(lucky?1.5:1)+0.08*l],['shield',1.8],['banana',2-f],['bolt',n>2?1+f:0.6],
    ['swap',r.rank>1?0.5+2*f:0],['bomb',lucky?0:Math.max(0.15,1.4-f-0.12*l)]]);

    if(tg&&tg.state==='run'&&!tg.fell&&tg.rocket<=0&&r.state==='run'&&!r.fell&&r.rocket<=0){
      for(const k of ['x','y','vy','avx','onGround','g','fi'])[r[k],tg[k]]=[tg[k],r[k]];
      r.tried=r.pass=tg.tried=tg.pass=null;r.stX=r.x;tg.stX=tg.x;

      say(g,`🔄 ${r.name} 和 ${tg.name} 互换了位置！`)}
    else it='boost'}
  if(it==='banana'){if(gapAt(g,r,r.x-30))it='boost';else g.traps.push({x:r.x-30,owner:r.id,t:0})}
  if(it==='boost')r.boost=2.2;

function targetSpeed(g,r,zone,grad){
  const a=r.a,n=g.aliveN,f=n>1?(r.rank-1)/(n-1):0;
  let m=1+0.012*(a.spd-5)+r.form+0.05*f-0.02*(1-f)+clamp((g.leadX-r.x-500)/9000,0,0.12);
  const tr=r.trait;
  if(tr==='late')m+=-0.04+0.088*clamp(g.t/90,0,1);
  else if(tr==='front'&&r.rank===1)m+=0.07;
  else if(tr==='come'&&f>=0.7)m+=0.07;
  else if(tr==='fear'&&r.x-g.wallX<280)m+=0.15;
  else if(tr==='start'&&g.t<10)m+=0.15;
  else if(tr==='draft'&&r.rank>1){const d=g.rank[r.rank-2];if(d&&d.x-r.x<130)m+=0.045}
  else if(tr==='clutch'&&n<=Math.min(4,Math.ceil(g.rs.length/2)))m+=0.1;
  if(r.boost>0)m+=0.35;if(r.perfT>0)m+=0.2;
  if(g.t<1.5)m+=0.02*(a.acc-5);
  if(g.ev){if(g.ev.type==='wind')m+=g.ev.dir>0?(tr==='wind'?0.28:0.18):tr==='wind'?0:-(0.2-0.015*(a.sta-5))*(1-0.5*f);else if(g.ev.type==='fever')m+=0.25}
  m*=1+clamp(grad,-0.6,0.6)*(grad<0?(tr==='climb'?0:0.55*(1-0.05*(a.sta-5))):tr==='climb'?0.8:0.35);
  if(zone){if(zone.type==='mud')m*=tr==='loach'?0.9:0.52+0.03*(a.sta-5);
    else if(zone.type==='ice')m*=tr==='slick'?1.32:1.18;
    else if(zone.type==='wind'){if(tr!=='wind')m*=0.66+0.03*(a.sta-5)}}
  return V0*clamp(m,0.3,2.2);
}

function updateRunner(g,r,dt){
  const a=r.a,rng=g.rng;
  if(r.state==='rescue'){r.resT-=dt;if(r.resT<=0){r.state='run';r.x=r.resX;r.y=groundY(g,r.x)-170;r.onGround=false;r.avx=40;r.vy=0;r.g=g.grav*0.5;r.stX=r.x;fixFi(g,r);burst(g,r.x,r.y,'#bfe9ff',10,120,0)}return}
  r.boost=Math.max(0,r.boost-dt);r.perfT=Math.max(0,r.perfT-dt);r.shield=Math.max(0,r.shield-dt);r.pendCd=Math.max(0,r.pendCd-dt);r.ccT=Math.max(0,r.ccT-dt);r.sq*=Math.pow(0.002,dt);
  r.formT-=dt;if(r.formT<=0){r.formT=2+rng()*3;r.formTg=clamp((rng()+rng()+rng()-1.5)*0.2+0.004*(a.luk-5),-0.2,0.2)}
  r.form+=(r.formTg-r.form)*Math.min(1,dt*1.5);
  if(r.stun>0){r.stun-=dt;r.spin+=dt*9;if(r.stun<=0){r.stun=0;r.slide=false;r.spin=0}}
  fixFi(g,r);
  const F=g.feats;
  if(r.rocket>0){
    r.rocket-=dt;r.x+=560*dt;r.y=lerp(r.y,groundY(g,r.x)-50,Math.min(1,dt*8));r.onGround=false;r.vy=0;r.avx=320;r.g=g.grav;
    if(r.rocket<=0&&gapNear(g,r))r.rocket=0.05;
    if(!g.headless&&Math.random()<0.7)g.parts.push({x:r.x-16,y:r.y-14,vx:-200-Math.random()*150,vy:(Math.random()-0.5)*80,life:0.4,max:0.4,col:Math.random()<0.5?'#ffa94d':'#ffe066',sz:5,grav:0});
    return;
  }
  let zone=null,belt=0;
  for(let i=r.fi;i<F.length;i++){
    const f=F[i];if(f.x0>r.x+120)break;
    const inside=r.x>f.x0&&r.x<f.x1;
    switch(f.type){
    case 'box':if(!f.got[r.id]&&r.x>=f.x0){f.got[r.id]=1;if(rng()<0.58+0.02*(a.luk-5)+(r.trait==='lucky'?0.2:0))giveItem(g,r)}break;
    case 'pend':{if(r.pendCd>0)break;const b=pendBob(g,f),dx=b[0]-r.x,dy=b[1]-(r.y-RAD);
      if(dx*dx+dy*dy<36*36){r.pendCd=2.5;
        if(rng()<0.3+0.03*(a.luk-5)+dodgeBonus(r)){popup(g,r,'闪避!','#8ce99a');r.sq=0.5}
        else if(knock(g,r,-230*(1-0.04*(a.bal-5))*(r.trait==='iron'?0.5:1),-430,0.5)){popup(g,r,'💥','#ff8787');g.shake=Math.max(g.shake,0.15)}}
      break}
    case 'mud':case 'ice':case 'wind':if(inside&&r.onGround)zone=f;break;
    case 'belt':if(inside&&r.onGround&&!(r.trait==='slick'&&f.dir<0))belt=f.dir*110;break;
    case 'spring':if(r.onGround&&Math.abs(r.x-f.x0-20)<18&&r.lastSpring!==f){
        r.lastSpring=f;f.anim=0.3;r.g=g.grav;r.onGround=false;const v=rng()+0.03*(a.bal-5)+0.01*(a.luk-5);
        if(v<0.2){r.avx=50;r.vy=-720*g.gk;popup(g,r,'弹歪了…','#ff8787')}
        else if(v>0.88){r.avx=r.vx*1.6+80;r.vy=-880*g.gk;r.st.perf++;popup(g,r,'完美弹射!','#ffe066')}
        else{r.avx=r.vx*1.3+70;r.vy=-760*g.gk}}
      break;
    case 'hurdle':if(f.broken||!r.onGround)break;
      {const d=f.x0-r.x,d0=clamp(r.vx*0.17,30,80);
      if(d>0&&r.stun<=0&&d<=d0&&(r.pass===f||r.tried!==f)){
        const p=clamp(0.78+0.026*(a.jmp-5)+0.008*(a.luk-5)+jumpMod(g)+(r.trait==='hop'?0.12:0),0.35,0.97);
        if(r.pass===f||rng()<p){const avx=Math.max(r.vx,230);r.g=g.grav;const vy=Math.max(g.grav*((d+56)/avx)/2,Math.sqrt(2*g.grav*(f.hh+14)));r.onGround=false;r.avx=avx;r.vy=-vy;
          if(r.pass===f)r.pass=null;else if(rng()<0.14+0.012*(a.luk-5)){r.perfT=1.2;r.st.perf++;popup(g,r,'完美!','#ffe066')}}
        r.tried=f;
      }else if(r.x+13>f.x0&&r.x<f.x1+4){
        if(r.trait==='iron'){f.broken=true;burst(g,f.x0+13,f.h-f.hh/2,'#c98d4f',14,260);popup(g,r,'铁头功!','#ffd8a8')}
        else{r.x=f.x0-14;r.vx=0;r.pass=f;if(hurt(g,r,0.55)){popup(g,r,'绊倒','#ff8787');burst(g,r.x+10,r.y-20,'#fff',5,120)}}
      }}
      break;
    case 'gap':if(r.onGround&&r.stun<=0&&r.x<=f.x0&&f.x0-r.x<=Math.max(6,r.vx*dt*1.5)){
        const w=f.x1-f.x0,p=clamp(0.76+0.026*(a.jmp-5)+0.008*(a.luk-5)-0.0007*(w-130)+jumpMod(g)+(r.trait==='hop'?0.12:0),0.35,0.97),avx=Math.max(r.vx,230);
        if(rng()<p){flightTo(g,r,avx,f.x1-r.x+28);if(rng()<0.14+0.012*(a.luk-5)){r.perfT=1.2;r.st.perf++;popup(g,r,'完美!','#ffe066')}}
        else flightTo(g,r,avx,(f.x0-r.x)+w*(0.3+0.5*rng()));
      }break;
    }
  }
  // 香蕉皮
  if(r.onGround&&r.stun<=0)for(let i=g.traps.length-1;i>=0;i--){const tp=g.traps[i];if(Math.abs(tp.x-r.x)<14&&(tp.owner!==r.id||tp.t>1)&&r.trait!=='slick'){g.traps.splice(i,1);if(hurt(g,r,0.9,true))popup(g,r,'🍌 滑倒!','#ffe066')}}
  if(r.onGround){

    if(r.stun>0)r.vx=Math.max(0,r.vx-(r.slide?160:1400)*dt);
    else{const tv=targetSpeed(g,r,zone,grad),ac=(zone&&zone.type==='ice'?0.35:1)*(520+70*a.acc)*(r.trait==='start'?1.8:1);r.vx+=clamp(tv-r.vx,-ac*dt*1.5,ac*dt)}
    if(zone&&zone.type==='ice'&&r.trait!=='slick'){

      if(r.iceT<=0){r.iceT=0.7;if(r.stun<=0&&rng()<0.2-0.022*(a.bal-5)-0.006*(a.luk-5)&&hurt(g,r,0.8,true))popup(g,r,'打滑!','#a5d8ff')}}
    r.zoneRef=zone;
    r.x+=(r.vx+belt)*dt;r.y=groundY(g,r.x);r.leg+=(r.vx+20)*dt*0.055;
    if(gapAt(g,r,r.x)){r.onGround=false;r.avx=Math.max(40,(r.vx+belt)*0.6);r.vy=0;r.g=g.grav}
  }else{
    r.vy+=r.g*dt;r.x+=r.avx*dt;r.y+=r.vy*dt;
    const gy=groundY(g,r.x),gp=gapAt(g,r,r.x);
    if(gp){if(r.y>gy+4){
        if(!r.fell){r.fell=true;r.st.falls++;popup(g,r,'掉坑!','#ff8787')}
        r.x=clamp(r.x,gp.x0+13,gp.x1-13);r.avx*=0.92;r.spin+=dt*8;
        if(r.y>gy+450){r.state='rescue';r.resT=0.5;r.resX=gp.x1+34;r.fell=false;r.stun=0;r.spin=0}}}
    else if(r.y>=gy&&(r.vy>=0||r.y>gy+8)){r.y=gy;r.onGround=true;r.vx=Math.max(0,r.avx);r.sq=0.4;r.fell=false;r.g=g.grav;if(r.stun<=0)r.spin=0}
  }
  // 卡死兜底
  if(Math.abs(r.x-r.stX)>40){r.stX=r.x;r.stT=0}
  else{r.stT+=dt;if(r.stT>4&&r.state==='run'&&r.onGround&&!g.over){r.stT=0;r.stun=0;r.pass=null;r.g=g.grav;r.onGround=false;r.avx=330;r.vy=-620;popup(g,r,'弹射脱困!','#8ce99a')}}
}

function updHazards(g,dt){
  const rng=g.rng,F=g.feats;
  // 落石区
  let lo=Infinity;for(const r of g.rank)if(r.fi<lo)lo=r.fi;

  else if(g.t<GRACE){gap=1000;vmin=0}

    if(g.rank[0].x>=g.duel.x)eliminate(g,g.rank[1],'finish');
  }else if(g.t>=GRACE){
    const before=g.timer;g.timer-=dt;

    if(g.timer<=0){const v=g.rank[g.rank.length-1];bolt(g,v.x,v.y);eliminate(g,v,'bolt')}

// ================= 录制（仅本地运行时可用） =================
// 画面来自一块离屏画布：每帧把游戏画布贴上去，再补画计时、排名、解说（这些平时是 DOM，录不进画布流）
const REC_OK=(location.protocol==='file:'||/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname))&&!!window.MediaRecorder&&!!HTMLCanvasElement.prototype.captureStream;
const REC={on:false,mr:null,cv:null,c:null,blob:null,url:null,aDest:null,saved:false};
function recMime(){for(const m of ['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'])if(MediaRecorder.isTypeSupported(m))return m;return ''}
function recStart(){
  recDiscard();
  // 画布一旦被跨源图片污染，画面流就是空的（只剩声音）：提前发现并说明，而不是录出一份没有画面的文件
  try{ctx.getImageData(0,0,1,1)}catch(e){REC.err='本局没有录制：画布被本地图片文件污染，浏览器不允许录下画面。请运行 python icons/ai/pack.py 后刷新页面再试。';return}
  try{
    audio();const k=Math.min(1,1920/cv.width),w=Math.round(cv.width*k/2)*2,h=Math.round(cv.height*k/2)*2;
    REC.cv=document.createElement('canvas');REC.cv.width=w;REC.cv.height=h;REC.c=REC.cv.getContext('2d');
    const st=REC.cv.captureStream(60);
    if(!REC.aDest){REC.aDest=AC.createMediaStreamDestination();outBus.connect(REC.aDest)}
    REC.aDest.stream.getAudioTracks().forEach(t=>st.addTrack(t));
    const mime=recMime(),mr=new MediaRecorder(st,Object.assign({videoBitsPerSecond:6e6,audioBitsPerSecond:128000},mime?{mimeType:mime}:{})),chunks=[];
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    // 被丢弃的录制（REC.mr 已换人或清空）不生成文件
    mr.onstop=()=>{st.getVideoTracks().forEach(t=>t.stop());if(REC.mr!==mr)return;REC.mr=null;REC.blob=new Blob(chunks,{type:(mr.mimeType||mime||'video/webm').split(';')[0]});recUI()};
    mr.onerror=()=>{if(REC.mr===mr)recDiscard()};
    mr.start(1000);REC.mr=mr;REC.on=true;
  }catch(e){console.warn('录制启动失败',e);REC.on=false;REC.mr=null}
}

  const mr=REC.mr;REC.on=false;REC.mr=null;if(mr&&mr.state!=='inactive')try{mr.stop()}catch(e){}
  if(REC.url)URL.revokeObjectURL(REC.url);REC.blob=REC.url=REC.cv=REC.c=REC.err=null;REC.saved=false;recUI();

  $('awards').innerHTML=aw.filter(a=>a[1]).map(a=>`<div>${a[0]}　<b style="color:${a[1][0].color}">${esc(a[1][0].name)}</b>　${a[2](a[1][1])}</div>`).join('');
  $('rtable').innerHTML='<tr><th>名次</th><th>选手</th><th>特性</th><th>存活</th><th>结局</th><th>摔倒/被控</th><th>掉坑</th><th>道具</th><th>完美</th><th>领跑</th></tr>'+
    all.map((r,i)=>`<tr><td>${i+1}</td><td><b style="color:${r.color}">${esc(fullName(r))}</b></td><td>${TRAITS[r.trait][0]}</td><td>${(r.alive?g.t:r.deadT).toFixed(1)}s</td><td>${r.alive?'🏆 冠军':CAUSE[r.cause]}</td><td>${r.st.stuns}</td><td>${r.st.falls}</td><td>${r.st.items}</td><td>${r.st.perf}</td><td>${r.st.lead.toFixed(1)}s</td></tr>`).join('');
  $('result').classList.remove('hidden');$('hud').classList.add('hidden');$('result').scrollTop=0;
  g.nextT=watchMode?10:0;$('nextIn').textContent='';recStop();
}
// 首页背景：用全部资源包混搭的 12 名角色跑一局静音的演示比赛
function startDemo(){
  const kr=roster,kp=curPack;roster=[];curPack='mix';for(let i=0;i<12;i++)roster.push(randRunner());const cf=roster;roster=kr;curPack=kp;
  const mk=Object.keys(MAPS);game=newGame(cf,(Math.random()*1e9)>>>0,false,mk[Math.floor(Math.random()*mk.length)]);
  game.demo=game.silent=true;game.pre=0;game.intro=game.introDur=0;game.seedLabel='';paused=false;
}
function showHome(){
  musicStop();recDiscard();watchMode=false;document.body.classList.remove('watch');for(const id of ['hud','result','setup'])$(id).classList.add('hidden');$('home').classList.remove('hidden');
  $('homeInfo').textContent=`当前配置：${roster.length} 人 · ${curPack==='mix'?'全部混搭':PACKS[curPack].n} · 地图 ${$('selMap').selectedOptions[0].textContent}${$('chkWatch').checked?' · 纯观赏模式':''}${REC_OK&&$('chkRec').checked?' · 🎬 录制':''}`;
  startDemo();
}
function openSetup(){game=null;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);$('home').classList.add('hidden');$('setup').classList.remove('hidden')}
const quitGame=showHome;
function startDuelHook(g){if(g.duel&&g.duel.x0==null)g.duel.x0=g.leadX}
function frame(ts){
  const real=Math.min(0.05,(ts-lastTs)/1000||0);lastTs=ts;const g=game;
  if(g){
    let sc=0;
    if(!paused){g.real+=real;musicTick(g);
      if(g.intro<g.introDur){introTick(g,real);if(g.intro>=g.introDur)$('hud').classList.remove('hidden')}
      else if(g.pre>0){const b=Math.ceil(g.pre-0.4);g.pre-=real;const n=Math.ceil(g.pre-0.4);if(n!==b)sfx(g,n>=1?'beep':'go')}
      else{sc=(g.demo?1:speedMul)*(g.slow>0?0.3:1);g.slow-=real;g.acc+=real*sc;let n=0;while(g.acc>=DT&&n<14){step(g,DT);startDuelHook(g);g.acc-=DT;n++}if(n>=14)g.acc=0;
        if(g.over){g.overT+=real;if(g.overT>3.2&&!g.shown&&!g.demo){g.shown=true;showResult(g)}
          if(Math.random()<0.5)burst(g,g.winner.x+(Math.random()-0.5)*500,g.winner.y-320,`hsl(${Math.random()*360},90%,65%)`,4,160,500)}}
      updateCam(g,real);updFx(g,real*sc,real);
    }
    render(g);const inIntro=g.intro<g.introDur;if(inIntro)drawIntro(g);recFrame(g,inIntro);if(inIntro){requestAnimationFrame(frame);return}
    if(g.demo){if(g.over&&g.overT>2.5)startDemo()} // 首页背景的演示比赛：不显示界面，结束后自动换一局
    else if(!g.shown)hud(g,paused?0:real);
    else if(watchMode&&!paused&&recPending())$('nextIn').textContent='录像待处理：导出或删除后继续自动连播';
    else if(watchMode&&!paused){g.nextT-=real;$('nextIn').textContent=`${Math.max(1,Math.ceil(g.nextT))} 秒后自动开始下一局（Esc 或双击屏幕返回首页）`;if(g.nextT<=0)startGame(null)}
  }
  requestAnimationFrame(frame);
}
$('bSpeed').onclick=()=>{speedMul=speedMul===1?2:speedMul===2?4:1;$('bSpeed').textContent=speedMul+'×'};
$('bPause').onclick=()=>{paused=!paused;$('bPause').textContent=paused?'继续':'暂停';
  if(REC.on)try{paused?REC.mr.pause():REC.mr.resume()}catch(e){}};
// 声音按钮三档循环：全开 → 只关音乐 → 全部静音
$('bMute').onclick=()=>{if(!musicOff)musicOff=true;else if(!muted)muted=true;else muted=musicOff=false;$('bMute').textContent=muted?'🔇':musicOff?'🔈':'🔊';$('bMute').title=muted?'已静音':musicOff?'仅音效':'音乐+音效'};
// 浏览器要求先有用户操作才能出声：任何点击或按键都尝试恢复音频
for(const ev of ['pointerdown','keydown'])window.addEventListener(ev,()=>{if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})});
$('bQuit').onclick=$('bBack').onclick=$('bHome').onclick=showHome;
$('bHomeSetup').onclick=openSetup;
$('bHomeStart').onclick=()=>{const s=$('seed').value.trim();watchMode=$('chkWatch').checked;startGame(s===''?null:s)};
$('bAgain').onclick=()=>startGame(null);
$('bReplay').onclick=()=>startGame(lastSeed);
// 出场动画可跳过：点击屏幕，或按空格 / 回车（纯观赏模式下不响应点击，避免与双击退出冲突）
const skipIntro=()=>{if(game&&game.intro<game.introDur){game.intro=game.introDur;$('hud').classList.remove('hidden');return true}return false};
cv.addEventListener('pointerdown',()=>{if(!watchMode)skipIntro()});
window.addEventListener('keydown',e=>{if(e.code==='Escape'&&game&&!game.demo){quitGame();return}
  if((e.code==='Space'||e.code==='Enter')&&e.target.tagName!=='INPUT'&&skipIntro()){e.preventDefault();return}if(e.code==='Space'&&game&&!game.demo&&e.target.tagName!=='INPUT'){e.preventDefault();$('bPause').click()}});

// 触屏没有 Esc：纯观赏模式下双击（双触）屏幕返回设定
{let lastTap=0;window.addEventListener('pointerdown',()=>{if(!game||!watchMode)return;const now=performance.now();if(now-lastTap<380){lastTap=0;quitGame()}else lastTap=now})}
// 切回页面时恢复音频（移动端浏览器会挂起）
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state==='suspended')AC.resume().catch(()=>{})});
// 无头批量模拟（调参用）：simulate(人数, 局数)
window.simulate=function(n,count,mapKey){
  const out=[];const keep=roster;
  for(let k=0;k<count;k++){roster=[];for(let i=0;i<n;i++)roster.push(randRunner());
    const g=newGame(roster,(k*7919+n*131+17)>>>0,true,mapKey);let it=0;while(!g.over&&it++<60*400)step(g,DT);
    const cs={wall:0,bolt:0,finish:0,cap:0};g.order.forEach(r=>cs[r.cause]++);out.push({t:+g.t.toFixed(1),over:g.over,first:+(g.order[0]?g.order[0].deadT:0).toFixed(1),duelAt:+(g.order.length>1?g.order[g.order.length-2].deadT:0).toFixed(1),cs,falls:g.rs.reduce((s,r)=>s+r.st.falls,0)/n,stuns:g.rs.reduce((s,r)=>s+r.st.stuns,0)/n})}
  roster=keep;return out;
};

try{const p=localStorage.getItem('jellyPack');if(p==='mix'||PACKS[p])curPack=p;
  const s=JSON.parse(localStorage.getItem('jellyRoster'));s.forEach(r=>{r.style=r.style||'jelly';r.d=r.d||{}});
  if(Array.isArray(s)&&s.length>=2&&s.every(r=>r&&r.a&&TRAITS[r.trait]&&HATS[r.hat]&&SHAPES[r.shape]&&PACKS[r.style]&&(r.style==='jelly'||PACKS[r.style].list[r.ci])))roster=s.slice(0,16)}catch(e){}
$('ver').textContent=$('homeVer').textContent='v'+VERSION;
bindSetup();
if(REC_OK)$('lblRec').classList.remove('hidden');
if(roster.length>maxCount())roster.length=maxCount();
if(roster.length<2){roster=[];setCount(8)}else renderSetup();
requestAnimationFrame(frame);
// 网址带 ?watch 时直接以纯观赏模式开播
if(/[?&]watch\b/.test(location.search)){$('chkWatch').checked=true;watchMode=true;startGame(null)}else showHome();
</script>
